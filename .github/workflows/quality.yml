name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      - name: Verify lockfile is up to date
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --all-extras --all-groups --python ${{ matrix.python }}
      - name: Project quality gate
        run: uv run --python ${{ matrix.python }} --all-extras --all-groups python scripts/quality_gate.py
      - name: Reproduce public evidence offline
        run: uv run --python ${{ matrix.python }} python scripts/reproduce_benchmarks.py
      - name: Build distributions
        run: uv build
      - name: Smoke test installed wheel
        run: |
          uv venv /tmp/bench-wheel --python ${{ matrix.python }}
          uv pip install --python /tmp/bench-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/bench-wheel/bin/context-bench demo --output /tmp/wheel-demo
          /tmp/bench-wheel/bin/context-bench report /tmp/wheel-demo
