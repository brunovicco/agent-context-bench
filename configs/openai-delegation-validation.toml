provider = "openai"
model = "gpt-5.6-sol"
repetitions = 3
strategies = ["cache", "delegate_same_model", "delegate_small_model"]
summary_after = 3
max_output_tokens = 2048
timeout_seconds = 60
seed = 42

# USD per million tokens; public list prices checked on 2026-11-06.
# Explicit cache; total write price for the 30-minute TTL used by the project.
# Standard processing, prompts up to 272,000 input tokens.
# Promotional pricing through 2026-11-30; recheck before later runs.
# Source: https://developers.openai.com/api/docs/models/gpt-5.6-sol
[rates]
input = 4.0
cache_read = 0.4
cache_write = 5.0
output = 20.0
as_of = "2026-11-06"

# Same-model delegation inherits the main model and [rates].
# This section is used only for delegate_small_model, on the same provider.
[subagent]
model = "gpt-6-luna"

# Standard USD/MTok prices for prompts up to 272,000 input tokens.
# Source: https://developers.openai.com/api/docs/models/gpt-6-luna
[subagent.rates]
input = 0.1
cache_read = 0.01
cache_write = 0.125
output = 0.5
as_of = "2026-11-06"
