provider = "openai"
model = "gpt-5.6-sol"
repetitions = 1
strategies = ["status_full_history", "status_notes_same_model", "status_notes_small_model"]
status_updates_per_turn = 1
summary_after = 3
max_output_tokens = 2048
timeout_seconds = 60
seed = 42

# USD per million tokens; public list prices checked on 2026-11-06.
# Explicit cache; total write price for the 30-minute TTL used by the project.
# Standard processing, prompts up to 272,000 input tokens.
# Promotional pricing through 2026-11-30; recheck before later runs.
# Source: https://developers.openai.com/api/docs/models/gpt-5.6-sol
[rates]
input = 4.0
cache_read = 0.4
cache_write = 5.0
output = 20.0
as_of = "2026-11-06"

# Notes always use the main model and [rates].
# Only status_notes_small_model uses this renderer and its own rates.
[subagent]
model = "gpt-6-luna"

# Standard USD/MTok prices for prompts up to 272,000 input tokens.
# Source: https://developers.openai.com/api/docs/models/gpt-6-luna
[subagent.rates]
input = 0.1
cache_read = 0.01
cache_write = 0.125
output = 0.5
as_of = "2026-11-06"
